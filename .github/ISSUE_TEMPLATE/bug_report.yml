name: Bug report
description: Report a reproducible defect in the product, runtime or evaluation pipeline.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, tokens, private logs or customer data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA or release version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Relevant output
      description: Add sanitized test output or screenshots. Remove credentials and private data.
